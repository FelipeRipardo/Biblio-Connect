  <text x="380" y="770" font-family="Arial" font-size="10" fill="#b8c5d6" text-anchor="middle">Total de acessos (mês)</text>
  
  <text x="600" y="745" font-family="Arial" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">45h</text>
  <text x="600" y="770" font-family="Arial" font-size="10" fill="#b8c5d6" text-anchor="middle">Tempo médio leitura/aluno</text>
  
  <text x="820" y="745" font-family="Arial" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">94%</text>
  <text x="820" y="770" font-family="Arial" font-size="10" fill="#b8c5d6" text-anchor="middle">Engajamento</text>
  
  <text x="1040" y="745" font-family="Arial" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">4.5⭐</text>
