  <text x="300" y="415" font-family="Arial" font-size="11" fill="#333">8º Ano A</text>
  <rect x="400" y="400" width="280" height="18" rx="4" fill="#ecf0f1"/>
  <rect x="400" y="400" width="252" height="18" rx="4" fill="#27ae60"/>
