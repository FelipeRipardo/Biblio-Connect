  <text x="300" y="375" font-family="Arial" font-size="11" fill="#333">7º Ano B</text>
  <rect x="400" y="360" width="280" height="18" rx="4" fill="#ecf0f1"/>
  <rect x="400" y="360" width="210" height="18" rx="4" fill="#27ae60"/>
