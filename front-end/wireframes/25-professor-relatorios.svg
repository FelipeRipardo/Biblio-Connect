  <text x="50" y="400" font-family="Arial" font-size="12" fill="#b8c5d6">🔑 Alterar Senha</text>
  
  <!-- Main Content Header -->
  <rect x="250" y="0" width="950" height="70" fill="#fff" stroke="#e0e0e0"/>
  <text x="280" y="45" font-family="Georgia, serif" font-size="20" fill="#1e3a5f" font-weight="bold">Relatórios - Matemática</text>
  
  <!-- Filter Bar -->
  <rect x="280" y="85" width="860" height="50" rx="8" fill="#fff" stroke="#e0e0e0"/>
  <text x="300" y="115" font-family="Arial" font-size="11" fill="#666">Turma:</text>
  <rect x="350" y="95" width="140" height="30" rx="4" fill="#f8f9fa" stroke="#ddd"/>
  <text x="365" y="115" font-family="Arial" font-size="11" fill="#333">Todas as Turmas ▼</text>
  
  <text x="520" y="115" font-family="Arial" font-size="11" fill="#666">Período:</text>
  <rect x="580" y="95" width="120" height="30" rx="4" fill="#f8f9fa" stroke="#ddd"/>
  <text x="595" y="115" font-family="Arial" font-size="11" fill="#333">Bimestre 3 ▼</text>
  
  <text x="730" y="115" font-family="Arial" font-size="11" fill="#666">Livro:</text>
  <rect x="780" y="95" width="160" height="30" rx="4" fill="#f8f9fa" stroke="#ddd"/>
  <text x="795" y="115" font-family="Arial" font-size="11" fill="#333">Todos os Livros ▼</text>
  
  <rect x="970" y="95" width="100" height="30" rx="4" fill="#9b59b6"/>
  <text x="995" y="115" font-family="Arial" font-size="11" fill="#fff">Atualizar</text>
  
