  <text x="520" y="220" font-family="Arial" font-size="28" fill="#27ae60" font-weight="bold">98</text>
  <text x="580" y="220" font-family="Arial" font-size="12" fill="#999">(77%)</text>
  
  <rect x="720" y="150" width="200" height="90" rx="10" fill="#fff" stroke="#e0e0e0"/>
