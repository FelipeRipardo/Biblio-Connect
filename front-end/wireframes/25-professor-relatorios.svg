  <text x="300" y="495" font-family="Arial" font-size="11" fill="#333">9º Ano A</text>
  <rect x="400" y="480" width="280" height="18" rx="4" fill="#ecf0f1"/>
  <rect x="400" y="480" width="196" height="18" rx="4" fill="#27ae60"/>
  <text x="690" y="494" font-family="Arial" font-size="10" fill="#666">70%</text>
  
