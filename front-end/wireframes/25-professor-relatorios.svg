  <rect x="720" y="260" width="420" height="250" rx="10" fill="#fff" stroke="#e0e0e0"/>
  <text x="740" y="295" font-family="Arial" font-size="13" fill="#1e3a5f" font-weight="bold">⚠️ Alunos que Precisam de Atenção</text>
  
  <rect x="740" y="315" width="380" height="45" rx="4" fill="#fff5f5"/>
  <circle cx="765" cy="337" r="15" fill="#e74c3c"/>
  <text x="765" y="342" font-family="Arial" font-size="9" fill="#fff" text-anchor="middle">MS</text>
  <text x="790" y="332" font-family="Arial" font-size="11" fill="#333">Maria Santos - 7º Ano B</text>
  <text x="790" y="347" font-family="Arial" font-size="10" fill="#e74c3c">Não iniciou nenhuma leitura</text>
  
  <rect x="740" y="370" width="380" height="45" rx="4" fill="#fff5f5"/>
  <circle cx="765" cy="392" r="15" fill="#e74c3c"/>
  <text x="765" y="397" font-family="Arial" font-size="9" fill="#fff" text-anchor="middle">JL</text>
  <text x="790" y="387" font-family="Arial" font-size="11" fill="#333">João Lima - 8º Ano B</text>
  <text x="790" y="402" font-family="Arial" font-size="10" fill="#e74c3c">Atrasado em 2 leituras</text>
  
  <rect x="740" y="425" width="380" height="45" rx="4" fill="#fff3cd"/>
  <circle cx="765" cy="447" r="15" fill="#f39c12"/>
  <text x="765" y="452" font-family="Arial" font-size="9" fill="#fff" text-anchor="middle">AC</text>
  <text x="790" y="442" font-family="Arial" font-size="11" fill="#333">Ana Costa - 9º Ano A</text>
  <text x="790" y="457" font-family="Arial" font-size="10" fill="#856404">1 leitura pendente</text>
  
  <rect x="740" y="480" width="380" height="25" rx="4" fill="#f8f9fa"/>
  <text x="890" y="497" font-family="Arial" font-size="10" fill="#3498db" text-anchor="middle">Ver todos os 8 alunos →</text>
  
  <!-- Books Performance -->
  <rect x="280" y="530" width="540" height="180" rx="10" fill="#fff" stroke="#e0e0e0"/>
  <text x="300" y="565" font-family="Arial" font-size="13" fill="#1e3a5f" font-weight="bold">📚 Desempenho por Livro Didático</text>
  
  <text x="300" y="600" font-family="Arial" font-size="11" fill="#333">Matemática 7º Ano</text>
  <rect x="480" y="585" width="200" height="18" rx="4" fill="#ecf0f1"/>
  <rect x="480" y="585" width="180" height="18" rx="4" fill="#27ae60"/>
  <text x="690" y="599" font-family="Arial" font-size="10" fill="#666">90%</text>
  
  <text x="300" y="635" font-family="Arial" font-size="11" fill="#333">Matemática 8º Ano</text>
  <rect x="480" y="620" width="200" height="18" rx="4" fill="#ecf0f1"/>
  <rect x="480" y="620" width="150" height="18" rx="4" fill="#27ae60"/>
  <text x="690" y="634" font-family="Arial" font-size="10" fill="#666">75%</text>
  
  <text x="300" y="670" font-family="Arial" font-size="11" fill="#333">Matemática 9º Ano</text>
  <rect x="480" y="655" width="200" height="18" rx="4" fill="#ecf0f1"/>
  <rect x="480" y="655" width="130" height="18" rx="4" fill="#f39c12"/>
  <text x="690" y="669" font-family="Arial" font-size="10" fill="#666">65%</text>
  
  <text x="300" y="705" font-family="Arial" font-size="11" fill="#333">Exercícios Complementares</text>
  <rect x="480" y="690" width="200" height="18" rx="4" fill="#ecf0f1"/>
  <rect x="480" y="690" width="100" height="18" rx="4" fill="#f39c12"/>
  <text x="690" y="704" font-family="Arial" font-size="10" fill="#666">50%</text>
  
  <!-- Export Options -->
  <rect x="840" y="530" width="300" height="180" rx="10" fill="#fff" stroke="#e0e0e0"/>
  <text x="860" y="565" font-family="Arial" font-size="13" fill="#1e3a5f" font-weight="bold">📤 Exportar Relatório</text>
  
  <rect x="860" y="585" width="260" height="40" rx="6" fill="#27ae60"/>
  <text x="940" y="610" font-family="Arial" font-size="12" fill="#fff">📄 Exportar para Excel</text>
  
  <rect x="860" y="635" width="260" height="40" rx="6" fill="#e74c3c"/>
  <text x="955" y="660" font-family="Arial" font-size="12" fill="#fff">📑 Exportar PDF</text>
  
  <rect x="860" y="685" width="260" height="40" rx="6" fill="#3498db"/>
  <text x="920" y="710" font-family="Arial" font-size="12" fill="#fff">📧 Enviar para Coordenação</text>
