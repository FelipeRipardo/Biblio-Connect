  <text x="30" y="65" font-family="Arial" font-size="10" fill="#b8c5d6">Área do Professor</text>
  
  <!-- Professor Profile -->
  <circle cx="55" cy="115" r="22" fill="#9b59b6"/>
  <text x="55" y="122" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle">MS</text>
  <text x="90" y="110" font-family="Arial" font-size="12" fill="#fff">Prof. Maria Santos</text>
  <text x="90" y="125" font-family="Arial" font-size="10" fill="#b8c5d6">Matemática</text>
  
  <!-- Menu Items -->
  <text x="50" y="180" font-family="Arial" font-size="12" fill="#b8c5d6">📊 Visão Geral</text>
  <text x="50" y="215" font-family="Arial" font-size="12" fill="#b8c5d6">📚 Leituras da Turma</text>
  <text x="50" y="250" font-family="Arial" font-size="12" fill="#b8c5d6">📖 Definir Leituras</text>
  <text x="50" y="285" font-family="Arial" font-size="12" fill="#b8c5d6">👥 Meus Alunos</text>
  <rect x="0" y="300" width="250" height="40" fill="#2d5a87"/>
  <text x="50" y="325" font-family="Arial" font-size="12" fill="#fff">📝 Relatórios</text>
