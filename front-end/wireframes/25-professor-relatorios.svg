  <text x="300" y="455" font-family="Arial" font-size="11" fill="#333">8º Ano B</text>
  <rect x="400" y="440" width="280" height="18" rx="4" fill="#ecf0f1"/>
  <rect x="400" y="440" width="168" height="18" rx="4" fill="#f39c12"/>
