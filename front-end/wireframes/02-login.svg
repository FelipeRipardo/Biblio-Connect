<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5a87;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#f0f4f8"/>
  
  <!-- Left Side - Decorative -->
  <rect width="500" height="800" fill="url(#sideGrad)"/>
  
  <!-- Decorative Books -->
  <rect x="80" y="200" width="80" height="120" rx="4" fill="#27ae60" opacity="0.8"/>
  <text x="90" y="265" font-family="Arial" font-size="8" fill="#fff">MATEMÁTICA</text>
  <rect x="140" y="220" width="80" height="120" rx="4" fill="#3498db" opacity="0.8"/>
  <text x="150" y="285" font-family="Arial" font-size="8" fill="#fff">PORTUGUÊS</text>
  <rect x="200" y="180" width="80" height="120" rx="4" fill="#9b59b6" opacity="0.8"/>
  <text x="215" y="245" font-family="Arial" font-size="8" fill="#fff">HISTÓRIA</text>
  <rect x="260" y="240" width="80" height="120" rx="4" fill="#e74c3c" opacity="0.8"/>
  <text x="272" y="305" font-family="Arial" font-size="8" fill="#fff">CIÊNCIAS</text>
  
  <!-- Welcome Text -->
  <text x="80" y="430" font-family="Georgia, serif" font-size="32" fill="#fff" font-weight="bold">Bem-vindo!</text>
  <text x="80" y="470" font-family="Arial" font-size="16" fill="#b8c5d6">Acesse sua conta e continue</text>
  <text x="80" y="495" font-family="Arial" font-size="16" fill="#b8c5d6">sua jornada de aprendizado.</text>
  
  <!-- Stats -->
  <text x="80" y="570" font-family="Arial" font-size="14" fill="#fff">📚 5.200 livros didáticos</text>
  <text x="80" y="600" font-family="Arial" font-size="14" fill="#fff">👨‍🎓 1.850 alunos ativos</text>
  <text x="80" y="630" font-family="Arial" font-size="14" fill="#fff">👨‍🏫 120 professores</text>
  
  <!-- Logo -->
  <text x="80" y="100" font-family="Georgia, serif" font-size="28" fill="#fff" font-weight="bold">📚 BiblioConnect</text>
  
  <!-- Right Side - Login Form -->
  <rect x="500" width="700" height="800" fill="#fff"/>
  
  <!-- Login Card -->
  <rect x="620" y="100" width="460" height="600" rx="16" fill="#fff"/>
  
  <!-- Form Header -->
  <text x="850" y="170" font-family="Georgia, serif" font-size="28" fill="#1e3a5f" font-weight="bold" text-anchor="middle">Entrar</text>
  <text x="850" y="200" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">Acesse sua conta para continuar</text>
  
  <!-- User Type Selection -->
  <text x="670" y="250" font-family="Arial" font-size="13" fill="#333" font-weight="bold">Sou:</text>
  <rect x="670" y="265" width="110" height="40" rx="6" fill="#1e3a5f"/>
  <text x="700" y="290" font-family="Arial" font-size="12" fill="#fff">👨‍🎓 Aluno</text>
  <rect x="795" y="265" width="120" height="40" rx="6" fill="#fff" stroke="#ddd"/>
  <text x="820" y="290" font-family="Arial" font-size="12" fill="#666">👨‍🏫 Professor</text>
  <rect x="930" y="265" width="100" height="40" rx="6" fill="#fff" stroke="#ddd"/>
  <text x="952" y="290" font-family="Arial" font-size="12" fill="#666">👤 Admin</text>
  
  <!-- Email Field -->
  <text x="670" y="340" font-family="Arial" font-size="13" fill="#333" font-weight="bold">Email ou Matrícula</text>
  <rect x="670" y="350" width="360" height="50" rx="8" fill="#f8f9fa" stroke="#ddd"/>
  <text x="690" y="382" font-family="Arial" font-size="14" fill="#999">seu.email@escola.edu.br</text>
  
  <!-- Password Field -->
  <text x="670" y="430" font-family="Arial" font-size="13" fill="#333" font-weight="bold">Senha</text>
  <rect x="670" y="440" width="360" height="50" rx="8" fill="#f8f9fa" stroke="#ddd"/>
  <text x="690" y="472" font-family="Arial" font-size="14" fill="#999">••••••••</text>
  <text x="990" y="472" font-family="Arial" font-size="12" fill="#999">👁</text>
  
  <!-- Remember + Forgot -->
  <rect x="670" y="510" width="18" height="18" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="695" y="524" font-family="Arial" font-size="13" fill="#666">Lembrar de mim</text>
  <text x="920" y="524" font-family="Arial" font-size="13" fill="#e07c24">Esqueci minha senha</text>
  
  <!-- Login Button -->
  <rect x="670" y="560" width="360" height="50" rx="8" fill="#1e3a5f"/>
  <text x="850" y="592" font-family="Arial" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">Entrar</text>
  
  <!-- Divider -->
  <line x1="670" y1="640" x2="790" y2="640" stroke="#ddd" stroke-width="1"/>
  <text x="850" y="645" font-family="Arial" font-size="12" fill="#999" text-anchor="middle">ou continue com</text>
  <line x1="910" y1="640" x2="1030" y2="640" stroke="#ddd" stroke-width="1"/>
  
  <!-- Social Login -->
  <rect x="670" y="665" width="170" height="45" rx="8" fill="#fff" stroke="#ddd"/>
  <text x="755" y="693" font-family="Arial" font-size="13" fill="#333" text-anchor="middle">🔵 Google Edu</text>
  
  <rect x="860" y="665" width="170" height="45" rx="8" fill="#fff" stroke="#ddd"/>
  <text x="945" y="693" font-family="Arial" font-size="13" fill="#333" text-anchor="middle">🔷 Microsoft</text>
  
  <!-- Register Link -->
  <text x="780" y="750" font-family="Arial" font-size="14" fill="#666">Primeiro acesso?</text>
  <text x="898" y="750" font-family="Arial" font-size="14" fill="#e07c24" font-weight="bold">Cadastre-se</text>
</svg>