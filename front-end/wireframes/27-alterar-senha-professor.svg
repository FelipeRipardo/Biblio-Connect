<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="900" fill="#f5f5f5"/>
  
  <!-- Sidebar -->
  <rect width="250" height="900" fill="#1e3a5f"/>
  
  <!-- Logo -->
  <text x="30" y="45" font-family="Georgia, serif" font-size="18" fill="#fff" font-weight="bold">📚 BiblioConnect</text>
  <text x="30" y="65" font-family="Arial" font-size="10" fill="#b8c5d6">Área do Professor</text>
  
  <!-- Professor Profile -->
  <circle cx="55" cy="115" r="22" fill="#9b59b6"/>
  <text x="55" y="122" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle">MS</text>
  <text x="90" y="110" font-family="Arial" font-size="12" fill="#fff">Prof. Maria Santos</text>
  <text x="90" y="125" font-family="Arial" font-size="10" fill="#b8c5d6">Matemática</text>
  
  <!-- Menu Items -->
  <text x="50" y="180" font-family="Arial" font-size="12" fill="#b8c5d6">📊 Visão Geral</text>
  <text x="50" y="215" font-family="Arial" font-size="12" fill="#b8c5d6">📚 Leituras da Turma</text>
  <text x="50" y="250" font-family="Arial" font-size="12" fill="#b8c5d6">📖 Definir Leituras</text>
  <text x="50" y="285" font-family="Arial" font-size="12" fill="#b8c5d6">👥 Meus Alunos</text>
  <text x="50" y="320" font-family="Arial" font-size="12" fill="#b8c5d6">📝 Relatórios</text>
  <text x="50" y="355" font-family="Arial" font-size="12" fill="#b8c5d6">⚙️ Meu Perfil</text>
  <rect x="0" y="370" width="250" height="40" fill="#2d5a87"/>
  <text x="50" y="395" font-family="Arial" font-size="12" fill="#fff">🔑 Alterar Senha</text>
  
  <!-- Main Content Header -->
  <rect x="250" y="0" width="950" height="70" fill="#fff" stroke="#e0e0e0"/>
  <text x="280" y="45" font-family="Georgia, serif" font-size="20" fill="#1e3a5f" font-weight="bold">Alterar Senha</text>
  
  <!-- Main Form Area -->
  <rect x="280" y="90" width="500" height="520" rx="10" fill="#fff" stroke="#e0e0e0"/>
  
  <!-- Security Icon -->
  <circle cx="530" cy="160" r="40" fill="#f3e5f5"/>
  <text x="530" y="175" font-family="Arial" font-size="40" text-anchor="middle">🔐</text>
  
  <text x="530" y="220" font-family="Arial" font-size="16" fill="#1e3a5f" text-anchor="middle" font-weight="bold">Segurança da Conta</text>
  <text x="530" y="240" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">Mantenha sua senha segura e atualizada</text>
  
  <!-- Current Password -->
  <text x="330" y="285" font-family="Arial" font-size="12" fill="#333">Senha Atual *</text>
  <rect x="330" y="295" width="400" height="45" rx="6" fill="#f8f9fa" stroke="#ddd"/>
  <text x="350" y="325" font-family="Arial" font-size="13" fill="#999">••••••••</text>
  <text x="700" y="325" font-family="Arial" font-size="12" fill="#9b59b6">👁️</text>
  
  <!-- New Password -->
  <text x="330" y="365" font-family="Arial" font-size="12" fill="#333">Nova Senha *</text>
  <rect x="330" y="375" width="400" height="45" rx="6" fill="#f8f9fa" stroke="#ddd"/>
  <text x="350" y="405" font-family="Arial" font-size="13" fill="#999">Digite a nova senha</text>
  <text x="700" y="405" font-family="Arial" font-size="12" fill="#9b59b6">👁️</text>
  
  <!-- Password Strength Indicator -->
  <rect x="330" y="425" width="400" height="6" rx="3" fill="#ecf0f1"/>
  <rect x="330" y="425" width="320" height="6" rx="3" fill="#27ae60"/>
  <text x="330" y="445" font-family="Arial" font-size="10" fill="#27ae60">Força da senha: Forte ✓</text>
  
  <!-- Confirm New Password -->
  <text x="330" y="480" font-family="Arial" font-size="12" fill="#333">Confirmar Nova Senha *</text>
  <rect x="330" y="490" width="400" height="45" rx="6" fill="#f8f9fa" stroke="#ddd"/>
  <text x="350" y="520" font-family="Arial" font-size="13" fill="#999">Confirme a nova senha</text>
  <text x="700" y="520" font-family="Arial" font-size="12" fill="#9b59b6">👁️</text>
  
  <!-- Buttons -->
  <rect x="330" y="555" width="190" height="45" rx="6" fill="#9b59b6"/>
  <text x="385" y="583" font-family="Arial" font-size="13" fill="#fff" font-weight="bold">Salvar Nova Senha</text>
  
  <rect x="540" y="555" width="190" height="45" rx="6" fill="#fff" stroke="#ddd"/>
  <text x="610" y="583" font-family="Arial" font-size="13" fill="#666">Cancelar</text>
  
  <!-- Security Tips Card -->
  <rect x="810" y="90" width="320" height="320" rx="10" fill="#fff" stroke="#e0e0e0"/>
  <text x="830" y="125" font-family="Arial" font-size="14" fill="#1e3a5f" font-weight="bold">💡 Requisitos de Senha</text>
  
  <rect x="830" y="145" width="280" height="40" rx="5" fill="#e8f5e9"/>
  <text x="850" y="165" font-family="Arial" font-size="11" fill="#27ae60">✓ Mínimo de 8 caracteres</text>
  <text x="850" y="180" font-family="Arial" font-size="10" fill="#666">Recomendado: 12 ou mais</text>
  
  <rect x="830" y="195" width="280" height="40" rx="5" fill="#e8f5e9"/>
  <text x="850" y="215" font-family="Arial" font-size="11" fill="#27ae60">✓ Letras maiúsculas e minúsculas</text>
  <text x="850" y="230" font-family="Arial" font-size="10" fill="#666">Exemplo: AbCdEf</text>
  
  <rect x="830" y="245" width="280" height="40" rx="5" fill="#e8f5e9"/>
  <text x="850" y="265" font-family="Arial" font-size="11" fill="#27ae60">✓ Números</text>
  <text x="850" y="280" font-family="Arial" font-size="10" fill="#666">Exemplo: 123456</text>
  
  <rect x="830" y="295" width="280" height="40" rx="5" fill="#e8f5e9"/>
  <text x="850" y="315" font-family="Arial" font-size="11" fill="#27ae60">✓ Caracteres especiais</text>
  <text x="850" y="330" font-family="Arial" font-size="10" fill="#666">Como: @, #, $, !, %</text>
  
  <rect x="830" y="345" width="280" height="45" rx="5" fill="#fce4ec"/>
  <text x="850" y="365" font-family="Arial" font-size="11" fill="#c62828">✗ Não use senhas anteriores</text>
  <text x="850" y="380" font-family="Arial" font-size="10" fill="#666">Últimas 5 senhas bloqueadas</text>
  
  <!-- Help Section -->
  <rect x="810" y="430" width="320" height="180" rx="10" fill="#fff" stroke="#e0e0e0"/>
  <text x="830" y="465" font-family="Arial" font-size="14" fill="#1e3a5f" font-weight="bold">❓ Precisa de Ajuda?</text>
  
  <text x="830" y="500" font-family="Arial" font-size="11" fill="#333">Esqueceu sua senha atual?</text>
  <text x="830" y="520" font-family="Arial" font-size="11" fill="#9b59b6">→ Use "Esqueci minha senha" no login</text>
  
  <text x="830" y="555" font-family="Arial" font-size="11" fill="#333">Problemas de acesso?</text>
  <text x="830" y="575" font-family="Arial" font-size="11" fill="#9b59b6">→ Contate a administração escolar</text>
  
  <!-- Last password change info -->
  <rect x="280" y="630" width="860" height="60" rx="10" fill="#fff" stroke="#e0e0e0"/>
  <text x="300" y="660" font-family="Arial" font-size="11" fill="#666">ℹ️ Última alteração de senha: 15/08/2026 às 14:32</text>
  <text x="300" y="680" font-family="Arial" font-size="10" fill="#999">Por questões de segurança, recomendamos alterar sua senha a cada 90 dias.</text>
  <rect x="1000" y="645" width="120" height="30" rx="5" fill="#f8f9fa"/>
  <text x="1020" y="665" font-family="Arial" font-size="10" fill="#9b59b6">📜 Ver histórico</text>
</svg>
