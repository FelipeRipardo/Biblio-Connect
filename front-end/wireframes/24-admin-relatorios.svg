  <text x="1070" y="475" font-family="Arial" font-size="16" fill="#27ae60" font-weight="bold">92%</text>
  <text x="900" y="510" font-family="Arial" font-size="11" fill="#666">Atrasos:</text>
  <text x="1070" y="510" font-family="Arial" font-size="16" fill="#e74c3c" font-weight="bold">12</text>
  <text x="900" y="545" font-family="Arial" font-size="11" fill="#666">Novos Cadastros:</text>
  <text x="1070" y="545" font-family="Arial" font-size="16" fill="#9b59b6" font-weight="bold">23</text>
  
