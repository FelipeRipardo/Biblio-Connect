  <rect x="908" y="180" width="84" height="130" fill="#fff"/>
  <rect x="916" y="190" width="30" height="45" rx="2" fill="#27ae60"/>
  <rect x="952" y="190" width="30" height="45" rx="2" fill="#9b59b6"/>
