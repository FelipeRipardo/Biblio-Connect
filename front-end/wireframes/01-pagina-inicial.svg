  <text x="205" y="635" font-family="Arial" font-size="24" text-anchor="middle">📚</text>
  <text x="205" y="670" font-family="Arial" font-size="13" fill="#1e3a5f" text-anchor="middle" font-weight="bold">Acervo Digital</text>
  <text x="205" y="693" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">Livros e materiais</text>
  <text x="205" y="710" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">educacionais online</text>
  
