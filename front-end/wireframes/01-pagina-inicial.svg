  <text x="1045" y="670" font-family="Arial" font-size="13" fill="#1e3a5f" text-anchor="middle" font-weight="bold">Para Professores</text>
  <text x="1045" y="693" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">Acompanhe as leituras</text>
  <text x="1045" y="710" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">dos seus alunos</text>
  
