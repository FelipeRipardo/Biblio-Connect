  <text x="485" y="693" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">Busque por título, autor</text>
  <text x="485" y="710" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">ou disciplina</text>
  
  <rect x="640" y="580" width="250" height="160" rx="12" fill="#fff" stroke="#e0e0e0"/>
  <circle cx="765" cy="625" r="28" fill="#fff3cd"/>
  <text x="765" y="635" font-family="Arial" font-size="24" text-anchor="middle">👨‍🎓</text>
  <text x="765" y="670" font-family="Arial" font-size="13" fill="#1e3a5f" text-anchor="middle" font-weight="bold">Para Estudantes</text>
  <text x="765" y="693" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">Acesso gratuito</text>
  <text x="765" y="710" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">a todo o conteúdo</text>
  
  <rect x="920" y="580" width="250" height="160" rx="12" fill="#fff" stroke="#e0e0e0"/>
