  <text x="830" y="45" font-family="Arial" font-size="13" fill="#b8c5d6">Contato</text>
  
  <!-- Login/Register buttons -->
  <rect x="950" y="20" width="80" height="35" rx="6" fill="transparent" stroke="#fff"/>
