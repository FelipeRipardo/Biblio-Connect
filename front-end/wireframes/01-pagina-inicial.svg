  <text x="230" y="810" font-family="Arial" font-size="28" fill="#fff" text-anchor="middle" font-weight="bold">500+</text>
  <text x="230" y="835" font-family="Arial" font-size="11" fill="#b8c5d6" text-anchor="middle">Livros Disponíveis</text>
  
  <text x="480" y="810" font-family="Arial" font-size="28" fill="#fff" text-anchor="middle" font-weight="bold">1.850</text>
  <text x="480" y="835" font-family="Arial" font-size="11" fill="#b8c5d6" text-anchor="middle">Alunos Cadastrados</text>
  
  <text x="730" y="810" font-family="Arial" font-size="28" fill="#fff" text-anchor="middle" font-weight="bold">45</text>
  <text x="730" y="835" font-family="Arial" font-size="11" fill="#b8c5d6" text-anchor="middle">Professores</text>
  
  <text x="980" y="810" font-family="Arial" font-size="28" fill="#fff" text-anchor="middle" font-weight="bold">12.500+</text>
  <text x="980" y="835" font-family="Arial" font-size="11" fill="#b8c5d6" text-anchor="middle">Acessos Realizados</text>
  
