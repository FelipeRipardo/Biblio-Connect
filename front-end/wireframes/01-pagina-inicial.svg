  <text x="100" y="230" font-family="Arial" font-size="18" fill="#b8c5d6">SISTEMA DE BIBLIOTECA VIRTUAL PARA ESCOLAS PÚBLICAS</text>
  
  <text x="100" y="290" font-family="Arial" font-size="15" fill="#fff">Organização, disponibilização e consulta de livros e materiais</text>
  <text x="100" y="315" font-family="Arial" font-size="15" fill="#fff">educacionais digitais. Facilitando o acesso dos estudantes e o</text>
  <text x="100" y="340" font-family="Arial" font-size="15" fill="#fff">gerenciamento do acervo pela comunidade escolar.</text>
  
