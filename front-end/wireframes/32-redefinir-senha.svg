<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient effect -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#2d5a87"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bgGrad)"/>
  
  <!-- Decorative pattern -->
  <text x="100" y="150" font-family="Arial" font-size="80" fill="rgba(255,255,255,0.03)">📚</text>
  <text x="900" y="200" font-family="Arial" font-size="70" fill="rgba(255,255,255,0.03)">📕</text>
  <text x="1000" y="700" font-family="Arial" font-size="90" fill="rgba(255,255,255,0.03)">📚</text>
  <text x="150" y="750" font-family="Arial" font-size="65" fill="rgba(255,255,255,0.03)">📗</text>
  
  <!-- Main Card -->
  <rect x="350" y="120" width="500" height="660" rx="20" fill="#fff" filter="drop-shadow(0 10px 40px rgba(0,0,0,0.3))"/>
  
  <!-- Logo -->
  <text x="600" y="190" font-family="Georgia, serif" font-size="28" fill="#1e3a5f" text-anchor="middle" font-weight="bold">📚 BiblioConnect</text>
  <text x="600" y="220" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">Sistema de Biblioteca Virtual para Escolas Públicas</text>
  
  <!-- Icon -->
  <circle cx="600" cy="290" r="45" fill="#e8f5e9"/>
  <text x="600" y="308" font-family="Arial" font-size="45" text-anchor="middle">🔐</text>
  
  <!-- Title -->
  <text x="600" y="370" font-family="Arial" font-size="22" fill="#1e3a5f" text-anchor="middle" font-weight="bold">Criar Nova Senha</text>
  <text x="600" y="400" font-family="Arial" font-size="13" fill="#666" text-anchor="middle">Digite sua nova senha para acessar o sistema</text>
  
  <!-- New Password Field -->
  <text x="400" y="450" font-family="Arial" font-size="12" fill="#333">Nova Senha *</text>
  <rect x="400" y="460" width="400" height="50" rx="8" fill="#f8f9fa" stroke="#ddd"/>
  <text x="430" y="492" font-family="Arial" font-size="14" fill="#999">Digite sua nova senha</text>
  <text x="770" y="492" font-family="Arial" font-size="18" fill="#666">👁️</text>
  
  <!-- Password Strength -->
  <rect x="400" y="515" width="400" height="6" rx="3" fill="#ecf0f1"/>
  <rect x="400" y="515" width="280" height="6" rx="3" fill="#27ae60"/>
  <text x="400" y="535" font-family="Arial" font-size="10" fill="#27ae60">Força da senha: Forte ✓</text>
  
  <!-- Confirm Password Field -->
  <text x="400" y="570" font-family="Arial" font-size="12" fill="#333">Confirmar Nova Senha *</text>
  <rect x="400" y="580" width="400" height="50" rx="8" fill="#f8f9fa" stroke="#ddd"/>
  <text x="430" y="612" font-family="Arial" font-size="14" fill="#999">Confirme sua nova senha</text>
  <text x="770" y="612" font-family="Arial" font-size="18" fill="#666">👁️</text>
  
  <!-- Password Match Indicator -->
  <text x="400" y="650" font-family="Arial" font-size="10" fill="#27ae60">✓ As senhas coincidem</text>
  
  <!-- Submit Button -->
  <rect x="400" y="670" width="400" height="50" rx="8" fill="#27ae60"/>
  <text x="600" y="702" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">Salvar Nova Senha</text>
  
  <!-- Back to Login Link -->
  <text x="600" y="755" font-family="Arial" font-size="13" fill="#3498db" text-anchor="middle">← Voltar para o Login</text>
  
  <!-- Password Requirements -->
  <rect x="400" y="140" width="400" height="0" rx="0" fill="transparent"/>
  
  <!-- Requirements Box on the right -->
  <rect x="880" y="250" width="280" height="280" rx="15" fill="#fff" filter="drop-shadow(0 5px 20px rgba(0,0,0,0.2))"/>
  <text x="900" y="285" font-family="Arial" font-size="14" fill="#1e3a5f" font-weight="bold">💡 Requisitos da Senha</text>
  
  <rect x="900" y="305" width="240" height="35" rx="5" fill="#e8f5e9"/>
  <text x="920" y="328" font-family="Arial" font-size="11" fill="#27ae60">✓ Mínimo 8 caracteres</text>
  
  <rect x="900" y="350" width="240" height="35" rx="5" fill="#e8f5e9"/>
  <text x="920" y="373" font-family="Arial" font-size="11" fill="#27ae60">✓ Letra maiúscula</text>
  
  <rect x="900" y="395" width="240" height="35" rx="5" fill="#e8f5e9"/>
  <text x="920" y="418" font-family="Arial" font-size="11" fill="#27ae60">✓ Letra minúscula</text>
  
  <rect x="900" y="440" width="240" height="35" rx="5" fill="#e8f5e9"/>
  <text x="920" y="463" font-family="Arial" font-size="11" fill="#27ae60">✓ Número</text>
  
  <rect x="900" y="485" width="240" height="35" rx="5" fill="#fff3cd"/>
  <text x="920" y="508" font-family="Arial" font-size="11" fill="#856404">○ Caractere especial (opcional)</text>
  
  <!-- Footer -->
  <text x="600" y="830" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">© 2026 BiblioConnect - Sistema de Biblioteca Virtual para Escolas Públicas</text>
  <text x="600" y="850" font-family="Arial" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">Precisa de ajuda? Contate a secretaria da escola</text>
</svg>
