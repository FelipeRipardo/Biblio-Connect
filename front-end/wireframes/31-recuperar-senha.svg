<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient effect -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#2d5a87"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bgGrad)"/>
  
  <!-- Decorative books pattern (background) -->
  <text x="100" y="150" font-family="Arial" font-size="80" fill="rgba(255,255,255,0.03)">📚</text>
  <text x="300" y="300" font-family="Arial" font-size="60" fill="rgba(255,255,255,0.03)">📖</text>
  <text x="900" y="200" font-family="Arial" font-size="70" fill="rgba(255,255,255,0.03)">📕</text>
  <text x="1000" y="700" font-family="Arial" font-size="90" fill="rgba(255,255,255,0.03)">📚</text>
  <text x="150" y="750" font-family="Arial" font-size="65" fill="rgba(255,255,255,0.03)">📗</text>
  
  <!-- Main Card -->
  <rect x="350" y="150" width="500" height="600" rx="20" fill="#fff" filter="drop-shadow(0 10px 40px rgba(0,0,0,0.3))"/>
  
  <!-- Logo -->
  <text x="600" y="220" font-family="Georgia, serif" font-size="28" fill="#1e3a5f" text-anchor="middle" font-weight="bold">📚 BiblioConnect</text>
  <text x="600" y="250" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">Biblioteca Virtual Escolar</text>
  
  <!-- Icon -->
  <circle cx="600" cy="320" r="50" fill="#fff3cd"/>
  <text x="600" y="340" font-family="Arial" font-size="50" text-anchor="middle">🔑</text>
  
  <!-- Title -->
  <text x="600" y="410" font-family="Arial" font-size="22" fill="#1e3a5f" text-anchor="middle" font-weight="bold">Recuperar Senha</text>
  <text x="600" y="440" font-family="Arial" font-size="13" fill="#666" text-anchor="middle">Digite seu email para receber as instruções</text>
  <text x="600" y="460" font-family="Arial" font-size="13" fill="#666" text-anchor="middle">de recuperação de senha.</text>
  
  <!-- Email Field -->
  <text x="400" y="510" font-family="Arial" font-size="12" fill="#333">Email cadastrado</text>
  <rect x="400" y="520" width="400" height="50" rx="8" fill="#f8f9fa" stroke="#ddd"/>
  <text x="430" y="552" font-family="Arial" font-size="14" fill="#999">Digite seu email...</text>
  <text x="770" y="552" font-family="Arial" font-size="18" fill="#666">📧</text>
  
  <!-- Submit Button -->
  <rect x="400" y="595" width="400" height="50" rx="8" fill="#27ae60"/>
  <text x="600" y="627" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">Enviar Link de Recuperação</text>
  
  <!-- Back to Login Link -->
  <text x="600" y="680" font-family="Arial" font-size="13" fill="#3498db" text-anchor="middle">← Voltar para o Login</text>
  
  <!-- Help text -->
  <rect x="400" y="710" width="400" height="30" rx="4" fill="#f8f9fa"/>
  <text x="600" y="730" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">Não recebeu o email? Verifique sua caixa de spam.</text>
  
  <!-- Success State Card (alternative view) -->
  <rect x="700" y="150" width="450" height="350" rx="20" fill="#fff" filter="drop-shadow(0 10px 40px rgba(0,0,0,0.3))"/>
  
  <text x="925" y="195" font-family="Arial" font-size="14" fill="#1e3a5f" text-anchor="middle" font-weight="bold">✉️ Estado após envio:</text>
  
  <circle cx="925" cy="280" r="45" fill="#d4edda"/>
  <text x="925" y="300" font-family="Arial" font-size="45" text-anchor="middle">✓</text>
  
  <text x="925" y="360" font-family="Arial" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="bold">Email Enviado!</text>
  <text x="925" y="390" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">Enviamos um link de recuperação para:</text>
  <text x="925" y="415" font-family="Arial" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">j***@escola.edu.br</text>
  
  <text x="925" y="455" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">O link expira em 24 horas.</text>
  
  <rect x="800" y="475" width="250" height="35" rx="6" fill="#f8f9fa" stroke="#ddd"/>
  <text x="925" y="498" font-family="Arial" font-size="11" fill="#3498db" text-anchor="middle">Reenviar email</text>
  
  <!-- Footer -->
  <text x="600" y="830" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">© 2026 BiblioConnect - Todos os direitos reservados</text>
  <text x="600" y="850" font-family="Arial" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">Precisa de ajuda? Contate a secretaria da escola</text>
</svg>
